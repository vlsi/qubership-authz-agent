# Keycloak for the kind end-to-end run (`make e2e-harness`).
#
# The image, built from test/keycloak/Dockerfile by `make e2e-images`, has the
# realms of test/k8s/authn/ already in its database, so the Pod imports
# nothing at startup. KC_HOSTNAME must match the in-cluster Service name: the
# issuer and the JWKS URI in the discovery document derive from it, and the
# agent fetches them from inside the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      # Keycloak calls no Kubernetes API.
      automountServiceAccountToken: false
      containers:
        - name: keycloak
          image: local/authz-test-keycloak:ci
          imagePullPolicy: Never
          # No bootstrap admin: nothing in the harness uses the admin API, the
          # realms carry every client and user the suites need, and a
          # credential the manifest does not hold cannot leak from it.
          env:
            - name: KC_HOSTNAME
              value: http://keycloak:8080/auth
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          # The image sets KC_HTTP_RELATIVE_PATH=/auth, which prefixes the
          # management endpoints too, so the health path carries /auth.
          startupProbe:
            httpGet:
              path: /auth/health/ready
              port: management
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /auth/health/ready
              port: management
            periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
              # The dev-mode H2 database lives on the container filesystem.
              ephemeral-storage: 512Mi
            limits:
              memory: 1536Mi
              ephemeral-storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 9000
      targetPort: management
