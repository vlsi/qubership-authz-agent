# Chart values for the parity replay on kind. They mirror what the Compose
# parity stack sets on its containers; the harness Services carry the same
# names as the Compose services, so the URLs are the same too.

IMAGE_REPOSITORY: local/authz-agent
TAG: ci

# A kind cluster has no core-operator and no meshes.core.netcracker.com CRD,
# and no monitoring.coreos.com CRDs for the PodMonitor either.
MESH_ROUTES_ENABLED: false
MONITORING_ENABLED: false

# The harness Keycloak. The agent takes its M2M token from the cloud-common
# realm here, with the parity-m2m client.
IDENTITY_PROVIDER_URL: http://idp:8080

# The parity realm as an explicit trusted provider. `allowMissingAud` is
# load-bearing: the end-user client of that realm mints tokens without an aud
# claim on purpose.
AUTHZ_TRUSTED_PROVIDERS:
  - id: parity-realm
    issuer: http://idp:8080/auth/realms/parity
    audiences:
      - netcracker
    required: true
    allowMissingAud: true
AUTHZ_JWKS_BOOTSTRAP_REQUIRED: true
AUTHZ_JWKS_HTTP_TIMEOUT: 2
AUTHZ_JWKS_HTTP_RETRIES: 20

# No tenant-manager in the harness; an empty value disables realm resolution.
AUTHZ_TENANT_MANAGER_URL: ""

# The suite seeds policies and PIPs through the authz-policy-admin stub,
# installed from its own chart with policy-admin-values.yaml in this directory,
# and waits PARITY_PULL_SETTLE_SECONDS (2 by default) after each write; the
# agent pulls them from the stub's Service.
AUTHZ_PAP_CLIENT_SOURCE_URL: http://authz-policy-admin:18090
AUTHZ_PAP_CLIENT_PULL_INTERVAL: 1

# The entitlements stub of the harness.
AUTHZ_ENTITLEMENTS_URL: http://entitlements-mock:8080
