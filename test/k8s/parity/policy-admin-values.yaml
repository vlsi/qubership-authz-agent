# Chart values for the authz-policy-admin stub in the kind harness of this
# directory. The image comes from `make e2e-images`, which side-loads it into
# the kind node. A kind cluster has no core-operator and no
# meshes.core.netcracker.com CRD.
IMAGE_REPOSITORY: local/authz-policy-admin
TAG: ci
MESH_ROUTES_ENABLED: false
# The parity suite compares upload answers with access-control's, which
# refuses a condition that reads an undeclared PIP.
AUTHZ_POLICY_ADMIN_REQUIRE_DECLARED_PIPS: true
