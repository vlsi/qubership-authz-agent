# Keycloak for the parity replay on kind (`make parity-harness`).
#
# The replay does not depend on persistence, so dev mode is enough. The image,
# built from test/keycloak/Dockerfile by `make e2e-images`, has the realms of
# test/k8s/parity/idp-seed/ and the users of test/parity/suite/testdata/realm/
# already in its database, so the Pod imports nothing at startup. The Service
# is named `idp` because that host is the issuer in the trusted-providers
# entry and in KC_HOSTNAME.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idp
  labels:
    app: idp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: idp
  template:
    metadata:
      labels:
        app: idp
    spec:
      # Keycloak calls no Kubernetes API.
      automountServiceAccountToken: false
      containers:
        - name: keycloak
          image: local/authz-test-keycloak:ci
          imagePullPolicy: Never
          # No bootstrap admin: nothing in the harness uses the admin API, the
          # realms carry every client and user the suites need, and a
          # credential the manifest does not hold cannot leak from it.
          env:
            - name: KC_HOSTNAME
              value: http://idp:8080/auth
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          # The image sets KC_HTTP_RELATIVE_PATH=/auth, which prefixes the
          # management endpoints too.
          startupProbe:
            httpGet:
              path: /auth/health/ready
              port: management
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /auth/health/ready
              port: management
            periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
              ephemeral-storage: 512Mi
            limits:
              memory: 1536Mi
              ephemeral-storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: idp
spec:
  selector:
    app: idp
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 9000
      targetPort: management
