---
# Build workflow for qubership-authz-agent: unit tests of every Go module,
# SonarQube analysis, and the dev images of the components in
# .qubership/docker.cfg.
#
# The repository has five Go modules, all listed in go.work:
#   .                              — the product module (two binaries, zero external deps)
#   test/parity/suite              — parity-replay test suite
#   test/integration/testify       — runtime integration suite (needs a running stack)
#   test/integration/pipstub       — pip-stub service used by the integration suite
#   test/integration/tenantmanager — tenant-manager emulator the agent calls in the kind harness
#
# The integration-tagged suites are not built here: without -tags integration
# the compiler leaves those files out, so this workflow runs the
# non-integration tests only. integration-tests.yaml compiles the tagged
# suites and runs the runtime suite against the Helm chart on a kind cluster.
#
# Go comes from the go directive of each module's go.mod, the same version
# integration-tests.yaml uses.

name: CI

run-name: >
  CI —
  ${{ github.event_name == 'push' && format('push [{0}]', github.event.head_commit.message) || '' }}
  ${{ github.event_name == 'pull_request' && format('PR ({0}) [{1}]', github.head_ref, github.event.pull_request.title) || '' }}

on:
  push:
    branches:
      - main
      - 'lts/**'
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: go-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.module.dir }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # name is the suffix of the module's coverage artifact; an artifact
        # name cannot contain the "/" of dir.
        module:
          - dir: .
            name: root
          - dir: test/parity/suite
            name: test_parity_suite
          - dir: test/integration/testify
            name: test_integration_testify
          - dir: test/integration/pipstub
            name: test_integration_pipstub
          - dir: test/integration/tenantmanager
            name: test_integration_tenantmanager
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module.dir }}/go.mod
          cache-dependency-path: ${{ matrix.module.dir }}/go.sum

      - name: Test with coverage
        working-directory: ${{ matrix.module.dir }}
        run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.module.name }}
          path: ${{ matrix.module.dir }}/coverage.out
          if-no-files-found: error

  sonar:
    name: Sonar analysis
    needs: [test]
    # A pull request from a fork gets no variables and no secrets.
    if: ${{ vars.SONAR_PROJECT_KEY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar reads the history to attribute new code and blame.
          fetch-depth: 0
          persist-credentials: false

      - name: Download coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: .sonar-artifacts

      # Each artifact unpacks into its own directory, so the paths are
      # .sonar-artifacts/coverage-<name>/coverage.out.
      - name: List coverage files
        id: coverage
        run: |
          paths=$(find .sonar-artifacts -name coverage.out | sort | paste -sd, -)
          if [ -z "$paths" ]; then
            echo "::error::No coverage files were downloaded"
            exit 1
          fi
          echo "paths=${paths}" >> "$GITHUB_OUTPUT"

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.go.coverage.reportPaths=${{ steps.coverage.outputs.paths }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  docker-config:
    name: Load Docker components
    needs: [test]
    # A pull request from a fork cannot push to ghcr.io.
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      BRANCH_TAGS: '{{ref-name}}-{{timestamp}}-{{runNumber}}, {{ref-name}}-{{short-sha}}, {{ref-name}}-snapshot'
      MAIN_TAGS: '{{ref-name}}-{{timestamp}}-{{runNumber}}, {{ref-name}}-{{short-sha}}'
    outputs:
      config: ${{ steps.resolve.outputs.config }}
      tags: ${{ steps.metadata.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve docker config
        id: resolve
        uses: netcracker/qubership-workflow-hub/actions/config-resolver@e6afd0a6bcc4f24d73e3e4d5fb9a31ada009e3f1 # v2.8.2
        with:
          file-path: .qubership/docker.cfg

      # The tags are the ones the shared core-infra workflow gave the dev
      # images: <ref>-<timestamp>-<run>, <ref>-<sha>, and <ref>-snapshot on a
      # branch; latest instead of main-snapshot on main. They are rendered
      # once here, so all images of a run share the timestamp tag.
      - name: Render tags
        id: metadata
        uses: netcracker/qubership-workflow-hub/actions/metadata-action@e6afd0a6bcc4f24d73e3e4d5fb9a31ada009e3f1 # v2.8.2
        with:
          ref: ${{ github.head_ref && format('refs/heads/{0}', github.head_ref) || github.ref }}
          default-template: ${{ github.ref == 'refs/heads/main' && env.MAIN_TAGS || env.BRANCH_TAGS }}
          extra-tags: ${{ github.ref == 'refs/heads/main' && 'latest' || '' }}

  docker:
    name: Image ${{ matrix.component.name }}
    needs: [docker-config]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.docker-config.outputs.config) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and push
        uses: netcracker/qubership-workflow-hub/actions/docker-action@e6afd0a6bcc4f24d73e3e4d5fb9a31ada009e3f1 # v2.8.2
        with:
          component: ${{ toJson(matrix.component) }}
          platforms: ${{ matrix.component.platforms }}
          tags: ${{ needs.docker-config.outputs.tags }}
          checkout: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-gate:
    name: Build gate
    runs-on: ubuntu-latest
    permissions: {}
    needs: [test, sonar, docker-config, docker]
    if: ${{ always() && github.event_name == 'pull_request' }}
    steps:
      # sonar, docker-config, and docker are skipped on a pull request from a
      # fork, and that passes. docker is also skipped when docker-config
      # fails, so the gate lists docker-config to see that failure.
      - name: Check build result
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"' <<<"$NEEDS")
          if [ -n "$failed" ]; then
            echo "::error::Build jobs did not succeed: ${failed//$'\n'/, }"
            exit 1
          fi
