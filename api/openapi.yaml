openapi: 3.0.3
info:
  title: Authz Agent
  version: 0.0.1
  description: |
    HTTP contract served by the Authz Agent runtime.

    This contract covers the public listener, port 8080
    (`AUTHZ_PUBLIC_ADDR`). It carries the public authorization surface
    (the access-control check API: v1, v2, and preview), `/api-version`
    and `/health`, and the internal admin surface
    (`/internal/v1/decision-logs`). The internal admin endpoint is
    isolated by URL prefix only. The two `servers` entries below
    distinguish the two intents.

    A second listener, port 8181 (`AUTHZ_HTTP_ADDR`), serves the probes
    the chart configures (`/health`, `/ready`), `/api-version`, and the
    metrics (`/prometheus`). It is not part of this contract.

    Notation:
      - `bearerAuth` covers the `Authorization: Bearer <jwt>` admission
        token applied across the public surface. The legacy
        `Incoming-Token` and `Authorization-Type` headers are
        modelled as per-operation header parameters because they are
        optional supplements, not standalone auth schemes.
      - `additionalProperties` is set explicitly on every schema. Open
        shapes (`additionalProperties: true`) are limited to the
        per-resource attribute bag (`resource`) and to the response of
        `GET /internal/v1/decision-logs`, which is a stream of OPA-emitted
        objects whose internal layout is not part of this contract.
      - `info.version` mirrors the authz-agent release version. The
        canonical source-of-truth is
        `helm-templates/authz-agent/Chart.yaml` (`version` field). The
        on-disk value is `0.0.1`; the build pipeline rewrites it for
        release artefacts.
servers:
  - url: http://localhost:8080
    description: Public authorization surface, reached from the host through a port-forward to the agent Service (`docs/local-integration-tests.md`).
  - url: http://localhost:8080
    description: Internal admin surface; same listener, segregated by the `/internal/v1/` URL prefix.
tags:
  - name: public
    description: Authorization decision endpoints reachable by every workload via the public ingress.
  - name: internal-admin
    description: Operator endpoints (decision-log retrieval).
  - name: meta
    description: Service metadata endpoints (`/api-version`, `/health`).
security:
  - bearerAuth: []
paths:
  /access/v1/check/resource:
    post:
      operationId: access_v1_check_resource
      tags: [public]
      summary: Legacy v1 OLS single-resource check.
      description: |
        Returns a JSON boolean literal (`true` or `false`) reflecting the
        OLS decision for a single `(type, operation, resource)`. The
        `tenant_id` query parameter is accepted for legacy thin-client
        compatibility but does not influence the decision.
      parameters:
        - $ref: '#/components/parameters/IncomingTokenHeader'
        - $ref: '#/components/parameters/AuthorizationTypeHeader'
        - $ref: '#/components/parameters/TenantIdQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckResourceRequest'
            examples:
              allow:
                summary: Resource the subject may read.
                value: { "type": "ATTACHMENT", "operation": "READ", "resource": {} }
              deny:
                summary: Resource the subject may not read.
                value: { "type": "ORDER", "operation": "READ", "resource": { "id": "order-1", "ownerId": "order-reader-1" } }
      responses:
        '200':
          description: Boolean OLS decision.
          content:
            application/json:
              schema:
                type: boolean
              examples:
                allow:
                  summary: Permit.
                  value: true
                deny:
                  summary: Reject.
                  value: false
        '400':
          description: Malformed body or missing required field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
              examples:
                bad_request:
                  value: { "message": "bad request" }
        '401':
          description: Authentication failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
              examples:
                missing_token:
                  value: { "message": "Authorization token is missing" }
  /access/v1/check/resource/bulk:
    post:
      operationId: access_v1_check_resource_bulk
      tags: [public]
      summary: Legacy v1 OLS bulk check.
      description: |
        Returns a JSON array of allowed resource ids in the same input
        order. Items missing an `id` are silently dropped. Duplicate ids
        within the request yield `400 { "message": "Duplicate resource id ..." }`.
      parameters:
        - $ref: '#/components/parameters/IncomingTokenHeader'
        - $ref: '#/components/parameters/AuthorizationTypeHeader'
        - $ref: '#/components/parameters/TenantIdQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CheckResourceBulkItem'
            examples:
              single_item:
                summary: One entry to evaluate.
                value: [{ "id": "item-1", "type": "ORDER", "operation": "READ", "resource": {} }]
              empty:
                summary: Empty batch.
                value: []
      responses:
        '200':
          description: Array of allowed ids (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              examples:
                allowed:
                  summary: Entry permitted.
                  value: ["item-1"]
                none:
                  summary: No entry permitted.
                  value: []
        '400':
          description: Malformed body, missing required field, or duplicate id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
              examples:
                duplicate_id:
                  value: { "message": "Duplicate resource id item-1" }
        '401':
          description: Authentication failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
              examples:
                missing_token:
                  value: { "message": "Authorization token is missing" }
  /access/v1/check/resource/bulk/operations:
    post:
      operationId: access_v1_check_resource_bulk_operations
      tags: [public]
      summary: Legacy v1 bulk-operations check.
      description: |
        Each entry carries an explicit list of `operations`. The response
        is a map keyed by operation name; each value is the list of ids
        whose decision was `ALLOW` for that operation. Keys are
        lexicographically sorted in the emitted JSON. An empty request
        body produces `{}`.
      parameters:
        - $ref: '#/components/parameters/IncomingTokenHeader'
        - $ref: '#/components/parameters/AuthorizationTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CheckResourceBulkOperationsItemV1'
            examples:
              single_entry:
                summary: One entry with one operation.
                value: [{ "id": "some-id", "type": "ORDER", "operations": ["READ"], "resource": {} }]
              empty:
                summary: Empty batch (yields {}).
                value: []
      responses:
        '200':
          description: Per-operation allowed-id map.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResourceBulkOperationsResponseV1'
              examples:
                allowed:
                  summary: Entry allowed for READ.
                  value: { "READ": ["some-id"] }
                denied:
                  summary: Entry denied for READ.
                  value: { "READ": [] }
        '400':
          description: Malformed body or missing required field on any entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
              examples:
                bad_request:
                  value: { "message": "bad request" }
        '401':
          description: Authentication failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
              examples:
                missing_token:
                  value: { "message": "Authorization token is missing" }
  /preview/v1/check/resource/bulk/operations:
    post:
      operationId: preview_v1_check_resource_bulk_operations
      tags: [public]
      summary: Preview v1 alias of `/access/v1/check/resource/bulk/operations`.
      description: Same wire shape as the `/access/v1/...` route; preview mount exists for thin-client routing.
      parameters:
        - $ref: '#/components/parameters/IncomingTokenHeader'
        - $ref: '#/components/parameters/AuthorizationTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CheckResourceBulkOperationsItemV1'
            examples:
              single_entry:
                summary: One entry with one operation.
                value: [{ "id": "some-id", "type": "ORDER", "operations": ["READ"], "resource": {} }]
              empty:
                summary: Empty batch (yields {}).
                value: []
      responses:
        '200':
          description: Per-operation allowed-id map.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResourceBulkOperationsResponseV1'
              examples:
                allowed:
                  summary: Entry allowed for READ.
                  value: { "READ": ["some-id"] }
                denied:
                  summary: Entry denied for READ.
                  value: { "READ": [] }
        '400':
          description: Malformed body or missing required field on any entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
              examples:
                bad_request:
                  value: { "message": "bad request" }
        '401':
          description: Authentication failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
              examples:
                missing_token:
                  value: { "message": "Authorization token is missing" }
  /access/v1/check/filter:
    post:
      operationId: access_v1_check_filter
      tags: [public]
      summary: Legacy v1 RLS filter / predicate.
      description: |
        Driven entirely by query parameters (`resourceType`, `operation`);
        the JSON body is reserved for legacy back-compat and must be
        present but is unused. Always returns the six-field
        `CheckFilterResponse` shape on `200`; a field of a dialect without
        a predicate is JSON `null`.
      parameters:
        - $ref: '#/components/parameters/IncomingTokenHeader'
        - $ref: '#/components/parameters/AuthorizationTypeHeader'
        - $ref: '#/components/parameters/TenantIdQuery'
        - name: resourceType
          in: query
          required: true
          schema:
            type: string
        - name: operation
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckFilterRequest'
            examples:
              empty_body:
                summary: Body is present but unused; inputs come from the query string.
                value: {}
      responses:
        '200':
          description: Filter predicate decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckFilterResponse'
              examples:
                allow:
                  summary: Unconditional ALLOW (no filter needed).
                  value: { "calculationResult": "ALLOW", "filterCondition": "", "mongodbFilterCondition": "", "rsqlFilterCondition": "", "sqlFilterCondition": "", "customFilterCondition": null }
                deny:
                  summary: Unconditional DENY.
                  value: { "calculationResult": "DENY", "filterCondition": "", "mongodbFilterCondition": "", "rsqlFilterCondition": "", "sqlFilterCondition": "", "customFilterCondition": null }
                use_filter_condition:
                  summary: ALLOW conditioned on a row-level RSQL predicate.
                  value: { "calculationResult": "USE_FILTER_CONDITION", "filterCondition": "", "mongodbFilterCondition": "", "rsqlFilterCondition": "dept==engineering,dept==management", "sqlFilterCondition": "", "customFilterCondition": null }
        '400':
          description: Missing required parameter (`resourceType`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
              examples:
                bad_request:
                  value: { "message": "bad request" }
        '401':
          description: Authentication failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
              examples:
                missing_token:
                  value: { "message": "Authorization token is missing" }
  /access/v2/check/resource:
    post:
      operationId: access_v2_check_resource
      tags: [public]
      summary: v2 OLS single-resource check.
      description: |
        Same input shape as `/access/v1/check/resource`; the response
        wraps the boolean in `{ "decision": <bool> }` to align with the v2
        thin-client expectations. The `obligations` query parameter is
        accepted but currently ignored.
      parameters:
        - $ref: '#/components/parameters/IncomingTokenHeader'
        - $ref: '#/components/parameters/AuthorizationTypeHeader'
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/ObligationsQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckResourceRequest'
            examples:
              allow:
                summary: Resource the subject may read.
                value: { "type": "ATTACHMENT", "operation": "READ", "resource": {} }
              deny:
                summary: Resource the subject may not read.
                value: { "type": "ORDER", "operation": "READ", "resource": {} }
      responses:
        '200':
          description: Wrapped boolean OLS decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResourceV2Response'
              examples:
                allow:
                  summary: Permit.
                  value: { "decision": true }
                deny:
                  summary: Reject.
                  value: { "decision": false }
        '400':
          description: Malformed body or missing required field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
              examples:
                bad_request:
                  value: { "message": "bad request" }
        '401':
          description: Authentication failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
              examples:
                missing_token:
                  value: { "message": "Authorization token is missing" }
  /access/v2/check/resource/bulk/operations:
    post:
      operationId: access_v2_check_resource_bulk_operations
      tags: [public]
      summary: v2 bulk-operations check.
      description: |
        The v2 request groups the shared resource type at the top level
        (`type`) and carries per-id entries in `entries`. The response
        wraps the per-operation map in `{ "decision": { ... } }`.
      parameters:
        - $ref: '#/components/parameters/IncomingTokenHeader'
        - $ref: '#/components/parameters/AuthorizationTypeHeader'
        - $ref: '#/components/parameters/ObligationsQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckResourceBulkOperationsRequestV2'
            examples:
              single_entry:
                summary: One resource type, one entry, one operation.
                value: { "type": "ORDER", "entries": [{ "id": "some-id", "operations": ["READ"], "resource": {} }] }
      responses:
        '200':
          description: Wrapped per-operation allowed-id map.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResourceBulkOperationsResponseV2'
              examples:
                allowed:
                  summary: Entry allowed for READ.
                  value: { "decision": { "READ": ["some-id"] } }
                denied:
                  summary: Entry denied for READ.
                  value: { "decision": { "READ": [] } }
        '400':
          description: Malformed body or missing required field on any entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
              examples:
                bad_request:
                  value: { "message": "bad request" }
        '401':
          description: Authentication failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
              examples:
                missing_token:
                  value: { "message": "Authorization token is missing" }
  /preview/v2/check/resource/bulk/operations:
    post:
      operationId: preview_v2_check_resource_bulk_operations
      tags: [public]
      summary: Preview v2 alias of `/access/v2/check/resource/bulk/operations`.
      description: Same wire shape as the `/access/v2/...` route; preview mount exists for thin-client routing.
      parameters:
        - $ref: '#/components/parameters/IncomingTokenHeader'
        - $ref: '#/components/parameters/AuthorizationTypeHeader'
        - $ref: '#/components/parameters/ObligationsQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckResourceBulkOperationsRequestV2'
            examples:
              single_entry:
                summary: One resource type, one entry, one operation.
                value: { "type": "ORDER", "entries": [{ "id": "some-id", "operations": ["READ"], "resource": {} }] }
      responses:
        '200':
          description: Wrapped per-operation allowed-id map.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResourceBulkOperationsResponseV2'
              examples:
                allowed:
                  summary: Entry allowed for READ.
                  value: { "decision": { "READ": ["some-id"] } }
                denied:
                  summary: Entry denied for READ.
                  value: { "decision": { "READ": [] } }
        '400':
          description: Malformed body or missing required field on any entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
              examples:
                bad_request:
                  value: { "message": "bad request" }
        '401':
          description: Authentication failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
              examples:
                missing_token:
                  value: { "message": "Authorization token is missing" }
  /access/v2/check/filter:
    post:
      operationId: access_v2_check_filter
      tags: [public]
      summary: v2 RLS filter / predicate.
      description: Identical wire shape to `/access/v1/check/filter`; the v2 thin client differs only in the query string.
      parameters:
        - $ref: '#/components/parameters/IncomingTokenHeader'
        - $ref: '#/components/parameters/AuthorizationTypeHeader'
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/ObligationsQuery'
        - name: resourceType
          in: query
          required: true
          schema:
            type: string
        - name: operation
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckFilterRequest'
            examples:
              empty_body:
                summary: Body is present but unused; inputs come from the query string.
                value: {}
      responses:
        '200':
          description: Filter predicate decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckFilterResponse'
              examples:
                allow:
                  summary: Unconditional ALLOW (no filter needed).
                  value: { "calculationResult": "ALLOW", "filterCondition": "", "mongodbFilterCondition": "", "rsqlFilterCondition": "", "sqlFilterCondition": "", "customFilterCondition": null }
                deny:
                  summary: Unconditional DENY.
                  value: { "calculationResult": "DENY", "filterCondition": "", "mongodbFilterCondition": "", "rsqlFilterCondition": "", "sqlFilterCondition": "", "customFilterCondition": null }
                use_filter_condition:
                  summary: ALLOW conditioned on a row-level RSQL predicate.
                  value: { "calculationResult": "USE_FILTER_CONDITION", "filterCondition": "", "mongodbFilterCondition": "", "rsqlFilterCondition": "dept==engineering,dept==management", "sqlFilterCondition": "", "customFilterCondition": null }
        '400':
          description: Missing required parameter (`resourceType`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
              examples:
                bad_request:
                  value: { "message": "bad request" }
        '401':
          description: Authentication failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
              examples:
                missing_token:
                  value: { "message": "Authorization token is missing" }
  /api-version:
    get:
      operationId: api_version_get
      tags: [meta]
      summary: Spec-version advertisement consumed by the legacy thin client.
      description: |
        Served as a static response; the policy engine never sees it.
      security: []
      responses:
        '200':
          description: Spec-version advertisement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVersionResponse'
              examples:
                advertised:
                  summary: Static spec-version advertisement.
                  value: { "specs": [{ "specRootUrl": "/access", "major": 3, "minor": 0, "supportedMajors": [1, 2, 3] }, { "specRootUrl": "/api", "major": 1, "minor": 1, "supportedMajors": [1] }, { "specRootUrl": "/template", "major": 1, "minor": 0, "supportedMajors": [1] }, { "specRootUrl": "/preview", "major": 2, "minor": 0, "supportedMajors": [1, 2] }] }
  /health:
    get:
      operationId: health_get
      tags: [meta]
      summary: Health of the agent on the public listener.
      description: |
        Returns `200 { "status": "healthy" }` once the agent's trusted
        providers have settled. An agent whose trusted providers fail to
        bootstrap, or whose trusted-providers configuration is invalid,
        returns `503 { "message": ..., "details": ... }`.
      security: []
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthHealthyResponse'
              examples:
                healthy:
                  value: { "status": "healthy" }
        '503':
          description: Unhealthy (degraded bootstrap).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthUnhealthyResponse'
              examples:
                bootstrap_threshold:
                  summary: Strict-mode JWKS bootstrap threshold not met.
                  value: { "message": "bootstrap threshold not met", "details": { "opaReady": true, "bootstrap": { "mode": "strict", "successCount": 0, "requiredCount": 1 } } }
  /internal/v1/decision-logs:
    get:
      operationId: internal_v1_decision_logs_get
      tags: [internal-admin]
      summary: Download accumulated OPA decision logs.
      description: |
        Returns the NDJSON stream of the decisions the agent recorded. The
        body may be empty when no decisions have been emitted yet. The
        per-line object shape is OPA-defined and not part of this contract.
      security: []
      responses:
        '200':
          description: NDJSON stream of decision events (possibly empty).
          content:
            application/x-ndjson:
              schema:
                type: string
              examples:
                sample_line:
                  summary: One sanitized decision-log line (placeholder token).
                  value: |
                    { "decision_id":"a1b2c3d4-0000-0000-0000-000000000000","path":"authorize","input":{ "authorizationToken":"Bearer <test-jwt-for-admin>","resources":[{ "resourceType":"ATTACHMENT","operation":"READ" }] },"result":{ "rlsIgnored":false,"results":[{ "isAllowed":true,"operation":"READ","resourceType":"ATTACHMENT" }] },"nd_builtin_cache":true,"timestamp":"2026-06-08T00:00:00Z" }
            text/plain:
              schema:
                type: string
              examples:
                empty:
                  summary: No decisions emitted yet.
                  value: ""
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IncomingTokenHeader:
      name: Incoming-Token
      in: header
      required: false
      description: |
        Legacy subject-token relay. On legacy routes this
        header carries the end-user JWT and takes precedence over
        `Authorization` for policy evaluation.
      schema:
        type: string
    AuthorizationTypeHeader:
      name: Authorization-Type
      in: header
      required: false
      description: |
        Set to `anonymous` to signal that no subject token is present;
        admission still requires a valid `Authorization` M2M token.
      schema:
        type: string
        enum: [anonymous]
    TenantIdQuery:
      name: tenant_id
      in: query
      required: false
      description: Accepted for legacy thin-client compatibility; does not influence the decision.
      schema:
        type: string
    ObligationsQuery:
      name: obligations
      in: query
      required: false
      description: v2 thin-client flag; currently parsed and ignored by the runtime.
      schema:
        type: string
  schemas:
    ResourceAttributes:
      type: object
      additionalProperties: true
      description: Open attribute bag exercised by per-resource policy conditions.
    CheckResourceRequest:
      type: object
      additionalProperties: false
      required: [type, operation]
      properties:
        type:
          type: string
        operation:
          type: string
        resource:
          $ref: '#/components/schemas/ResourceAttributes'
    CheckResourceV2Response:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: boolean
    CheckResourceBulkItem:
      type: object
      additionalProperties: false
      required: [type, operation]
      properties:
        id:
          type: string
          description: Optional; entries missing an id are silently dropped from the response array.
        type:
          type: string
        operation:
          type: string
        resource:
          $ref: '#/components/schemas/ResourceAttributes'
    CheckResourceBulkOperationsItemV1:
      type: object
      additionalProperties: false
      required: [id, type, operations]
      properties:
        id:
          type: string
        type:
          type: string
        operations:
          type: array
          items:
            type: string
        resource:
          $ref: '#/components/schemas/ResourceAttributes'
    CheckResourceBulkOperationsResponseV1:
      type: object
      description: Map keyed by operation name; each value is the list of ids whose decision was ALLOW.
      additionalProperties:
        type: array
        items:
          type: string
    CheckResourceBulkOperationsRequestV2:
      type: object
      additionalProperties: false
      required: [type, entries]
      properties:
        type:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/CheckResourceBulkOperationsEntryV2'
    CheckResourceBulkOperationsEntryV2:
      type: object
      additionalProperties: false
      required: [id, operations]
      properties:
        id:
          type: string
        operations:
          type: array
          items:
            type: string
        resource:
          $ref: '#/components/schemas/ResourceAttributes'
    CheckResourceBulkOperationsResponseV2:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          $ref: '#/components/schemas/CheckResourceBulkOperationsResponseV1'
    CheckFilterRequest:
      type: object
      description: |
        Body must be present (legacy thin-client convention) but is
        unused; all inputs come from query parameters.
      additionalProperties: false
    CheckFilterResponse:
      type: object
      additionalProperties: false
      required:
        - calculationResult
        - filterCondition
        - mongodbFilterCondition
        - rsqlFilterCondition
        - sqlFilterCondition
        - customFilterCondition
      properties:
        calculationResult:
          type: string
          enum: [ALLOW, DENY, USE_FILTER_CONDITION]
        filterCondition:
          type: string
          nullable: true
          description: The condition in QueryDSL; `null` without a QueryDSL predicate.
        mongodbFilterCondition:
          type: string
          nullable: true
          description: The condition in MongoDB; `null` without a MongoDB predicate.
        rsqlFilterCondition:
          type: string
          nullable: true
          description: The condition in RSQL; `null` without an RSQL predicate.
        sqlFilterCondition:
          type: string
          nullable: true
          description: The condition in SQL; `null` without an SQL predicate.
        customFilterCondition:
          type: object
          nullable: true
          description: The custom predicates as `logic`, joined by `AND`, `OR` and `NOT`, and their `data`; `null` without a custom predicate.
          required: [logic, data]
          properties:
            logic: {}
            data:
              type: object
              additionalProperties: true
    ApiVersionResponse:
      type: object
      additionalProperties: false
      required: [specs]
      properties:
        specs:
          type: array
          items:
            $ref: '#/components/schemas/ApiVersionSpec'
    ApiVersionSpec:
      type: object
      additionalProperties: false
      required: [specRootUrl, major, minor, supportedMajors]
      properties:
        specRootUrl:
          type: string
        major:
          type: integer
        minor:
          type: integer
        supportedMajors:
          type: array
          items:
            type: integer
    HealthHealthyResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [healthy]
    HealthUnhealthyResponse:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          description: |
            Human-readable summary of the failed health criterion
            (`trusted providers configuration is invalid`,
            `required identity providers did not bootstrap`,
            `bootstrap threshold not met`).
        details:
          $ref: '#/components/schemas/HealthErrorDetails'
    HealthErrorDetails:
      type: object
      additionalProperties: false
      description: |
        Diagnostic context for unhealthy responses. `opaReady` is always
        `true`, because the policy engine runs inside the agent's
        process. `bootstrap` is present when the failure was the JWKS
        bootstrap threshold check, and `configError` is present when the
        trusted-providers configuration file is unreadable or invalid.
      properties:
        opaReady:
          type: boolean
        configError:
          type: string
          description: |
            Present when the trusted-providers configuration file could not
            be read or parsed. A rejected config is surfaced here rather
            than silently clearing thresholds.
        bootstrap:
          $ref: '#/components/schemas/BootstrapHealthDetails'
    BootstrapHealthDetails:
      type: object
      additionalProperties: false
      required: [mode, successCount, requiredCount]
      properties:
        mode:
          type: string
          enum: [strict, permissive]
        successCount:
          type: integer
        requiredCount:
          type: integer
        missingRequired:
          type: array
          items:
            type: string
          description: |
            Names the identity providers marked `required: true` in the
            trusted-providers file that did not bootstrap successfully.
            Present only when at least one required provider is absent.
            Omitted when all required providers
            are healthy.
    LegacyErrorResponse:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
