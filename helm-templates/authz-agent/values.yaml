# Cloud-Deployer-injected platform keys.
PAAS_PLATFORM: "KUBERNETES"
NAMESPACE: ''
ARTIFACT_DESCRIPTOR_VERSION: ''
TAG: ''
# The agent's image without its tag, as the platform's charts name it; the
# image is IMAGE_REPOSITORY:TAG. The default is the component
# qubership-authz-agent that .qubership/docker.cfg lists, published by the docker action under the
# repository's owner on GHCR. The name is qubership- plus the service, as the platform names
# its images; for the agent that is also the repository's name.
IMAGE_REPOSITORY: ghcr.io/netcracker/qubership-authz-agent
SERVICE_NAME: "authz-agent"
DEPLOYMENT_VERSION: ''

# DEPLOYMENT_STRATEGY_TYPE, DEPLOYMENT_STRATEGY_MAXSURGE, and
# DEPLOYMENT_STRATEGY_MAXUNAVAILABLE are injected by Cloud-Deployer. TYPE has no
# default here because the schema admits only the platform's four strategy
# names (recreate, best_effort_controlled_rollout, ramped_slow_rollout,
# custom_rollout); unset renders the 25% rolling update. The two sizes are read
# under custom_rollout only and are strings in the schema, so a count is passed
# quoted or with `--set-string`.

# Pod spread. CLOUD_TOPOLOGIES is injected by Cloud-Deployer as a list of
# topologies, each with a required `topologyKey` and an optional `maxSkew`
# (1 when absent) and `whenUnsatisfiable` (ScheduleAnyway when absent):
#
#   CLOUD_TOPOLOGIES:
#     - topologyKey: topology.kubernetes.io/zone
#       maxSkew: 1
#       whenUnsatisfiable: DoNotSchedule
#
# Empty (default) spreads the Pods over CLOUD_TOPOLOGY_KEY alone, with a
# maximum skew of 1 and ScheduleAnyway, so a Pod the scheduler cannot spread
# is still scheduled.
CLOUD_TOPOLOGIES: []
CLOUD_TOPOLOGY_KEY: kubernetes.io/hostname

# Injected by Cloud-Deployer; every object carries it in its
# app.kubernetes.io/part-of label.
APPLICATION_NAME: 'Platform-Core-Security'
# Renders the PodMonitor by which the platform's VictoriaMetrics operator
# scrapes the agent's metrics at `/prometheus` on its internal port (8181). Set to
# false on a cluster without the monitoring.coreos.com CRDs (a plain kubeadm or
# kind cluster), where `helm install` fails on the unknown kind.
MONITORING_ENABLED: true
# Read-only root file system for the container, on Kubernetes; on OpenShift the
# template leaves it writable, as the platform's charts do. The decision log is
# the one thing the agent writes, and it goes to an emptyDir.
READONLY_CONTAINER_FILE_SYSTEM_ENABLED: true
# The app.kubernetes.io/managed-by label of every object but the Pod template.
# Cloud-Deployer overrides it (argocd installs set `argocd`).
MANAGED_BY: "saasDeployer"
# Injected by Cloud-Deployer to tie every object of one install session
# together. Empty (default) → the label is not rendered.
DEPLOYMENT_SESSION_ID: ''

# Service-mesh route registration (authz-agent-ADR-0074).
#
# Registers the access-control-compatible check API on the internal, private and
# public gateways, every route on the agent's public port (8080). The CRs are
# `core.netcracker.com/v1` `Mesh` objects handled by core-operator.
#
# Registering a prefix another service already serves is NOT a collision that
# fails or resolves at random — verified on a live stand. The control plane keys a
# route by prefix + virtual service + version, and the most recent registration
# REPLACES the previous one. Installing authz-agent therefore takes the check API
# over from access-control, which is the point; redeploying access-control takes
# it back, because it then registers last. Neither side owns these routes
# permanently, and a `RoutesDrop` would not change that — a drop applied earlier
# loses to a registration applied later.
#
# One invalid rule invalidates the WHOLE CR for that gateway (CORE-MESH-CP-4001),
# so a mistake here does not degrade one route, it un-registers every route the CR
# carries. Check `status.phase` on the Mesh CRs after the first install.
#
# Set to false on a cluster without core-operator (a plain kubeadm or kind
# cluster has no `meshes.core.netcracker.com` CRD, and `helm install` fails on
# the unknown kind), and on whichever of access-control / authz-agent is not
# meant to serve these routes when both run in one namespace.
MESH_ROUTES_ENABLED: true

# Pull policy for every container. The default is IfNotPresent because the
# pipeline tags images with an immutable pipeline id, so re-pulling an already
# cached layer set buys nothing and makes every Pod restart depend on the
# registry being reachable. Set to Always where a moving tag (`latest`) is
# deliberately used and the newest build must win on restart.
IMAGE_PULL_POLICY: IfNotPresent

# Root log level of the platform logger, rendered as LOGGING_LEVEL_ROOT, the
# variable the logger reads logging.level.root from. debug adds a line per
# decision on the request path and a line per tick of the policy pull; info
# leaves both out.
LOG_LEVEL: info

# authz-agent-specific runtime configuration.
AUTHZ_TRUSTED_PROVIDERS_FILE: /etc/authz/trusted-providers.json

# Base URL of the platform identity provider — the base only, no realm. This is
# the same variable, with the same meaning and the same default, that every
# platform backend already carries (EnvironmentVariables.java). With internal TLS
# it is `https://identity-provider:8443`.
#
# Used only when AUTHZ_TRUSTED_PROVIDERS below is empty: the chart then composes
# `<base>/auth/realms/<realm>` for each realm, exactly as the security libraries
# do (authz-agent-ADR-0075).
IDENTITY_PROVIDER_URL: http://identity-provider:8080
# Realms to trust when the provider list is generated. `cloud-common` is the
# platform M2M realm and is the one marked required — a Pod that cannot reach it
# does not become Ready. The others are optional: most namespaces genuinely have
# only some of them, and an absent realm logs one line rather than failing the
# install.
#
# A realm name becomes the provider `id`, so it is constrained to the same
# character set (`[A-Za-z0-9._-]`) and must be unique — the published index is
# keyed by id, and two entries sharing one would collapse into a single slot.
#
# Setting this to `[]` means NO providers at all, which is a working way to say
# "the agent trusts nobody yet" but leaves every token-bearing request rejected.
AUTHZ_IDP_REALMS:
  - cloud-common
  - default
  - cpq
  - external

# Trusted token providers, rendered into the `<name>-trusted-providers`
# ConfigMap. See components/authz-agent/internal/authn for the
# Go-side contract.
#
# An entry takes one of two forms and never both (authz-agent-ADR-0075):
#
#   - discovery: `issuer` is resolved through
#     `<issuer>/.well-known/openid-configuration` to a jwks_uri;
#   - explicit: `jwksUri` is fetched directly, and `issuer` must be absent.
#
# `issuer` is an ADDRESS, not a matching rule. The `iss` claim is not validated:
# tokens are matched to keys by `kid`, so a realm reached through a gateway
# hostname verifies the same as one reached in-cluster. There is no `algorithms`
# field — the algorithm comes from the key — and an entry still carrying one is
# a startup error rather than a warning.
#
# `audiences` is optional; when absent, `aud` is not checked at all.
# `allowMissingAud: true` matters only alongside `audiences`, where it also
# accepts tokens carrying no aud claim (M2M tokens minted without an audience
# mapper). Example:
#
#   AUTHZ_TRUSTED_PROVIDERS:
#     - id: cloud-common
#       issuer: http://identity-provider:8080/auth/realms/cloud-common
#       audiences: ["account"]
#       required: true
#       allowMissingAud: true
#
# EMPTY (the default) does NOT mean "trust nobody": the chart generates the list
# from IDENTITY_PROVIDER_URL and AUTHZ_IDP_REALMS above. Set this to take over.
# (Emptying AUTHZ_IDP_REALMS as well *does* mean trust nobody.)
#
# This ConfigMap can also be edited on a running installation: the agent
# watches the mounted file and republishes the fetched keys into OPA without a
# Pod restart (authz-agent-ADR-0070).
AUTHZ_TRUSTED_PROVIDERS: []

# Address of tenant-manager, used to resolve a realm named by its tenant DISPLAY
# name. A tenant realm is created by identity-provider with a generated UUID as
# its name and keeps the readable name only in Keycloak's `displayName`, so
# `default` — the platform's default tenant — is not a realm anyone can address;
# the addressable name is a UUID that differs per installation and cannot be
# written into a chart.
#
# The agent therefore asks tenant-manager
# `GET /api/v4/tenant-manager/registration/tenants?dns=<name>`, which is
# unauthenticated, and only AFTER discovery for the configured name has failed —
# a realm name that works is never second-guessed. An unreachable or unhelpful
# tenant-manager changes nothing: the provider fails exactly as it would have.
#
# Empty disables resolution, which is what a namespace with no tenant-manager
# wants (authz-agent-ADR-0075).
AUTHZ_TENANT_MANAGER_URL: http://tenant-manager:8080

# Bootstrap threshold: true = every configured provider must be fetched for the
# readiness probe to pass, false = one is enough. Applies only to an explicitly
# configured AUTHZ_TRUSTED_PROVIDERS — a generated list forces `false`, because
# it names four realms and a typical namespace has one; readiness for it is
# carried by the `required` marker on cloud-common instead.
#
# Independently of this flag, every provider marked `required` must bootstrap for
# the Pod to be Ready (authz-agent-ADR-0075).
AUTHZ_JWKS_BOOTSTRAP_REQUIRED: true
# Per-request timeout and retry count for OIDC discovery and JWKS fetches.
AUTHZ_JWKS_HTTP_TIMEOUT: 5
AUTHZ_JWKS_HTTP_RETRIES: 3
# Seconds between checks of the mounted trusted-providers file. 0 turns the
# watcher off, making provider changes require a Pod restart.
AUTHZ_TRUSTED_PROVIDERS_RELOAD_INTERVAL: 30

# Identity mode for the policy pull loop (and PIP calls).
#
# The pod carries exactly one M2M identity; the two modes differ in how that
# identity is provisioned:
#
#   KUBERNETES_M2M_ENABLED=true  (not default):
#     A Kubernetes projected ServiceAccount token (audience=netcracker,
#     ExpirationSeconds=600) is mounted at
#     /var/run/secrets/tokens/netcracker/token, the platform's layout for
#     projected tokens, by the kubelet and rotated automatically. The agent
#     re-reads it every fifteen seconds. No Secret dependency.
#
#   KUBERNETES_M2M_ENABLED=false (DEFAULT):
#     The agent obtains a Keycloak client_credentials token from the
#     cloud-common realm itself, with the credentials mounted from the Secret
#     below, and refreshes it before it expires. Where a sidecar wrote that
#     token to a shared path for the Pod, the agent now holds it in memory.
#
# KEYCLOAK ROLES REQUIRED (deployer note — NOT a chart field):
#   The Keycloak client for authz-agent must carry realm roles:
#     ROLE_M2M
#     ROLE_authz-agent
#   Pattern matches access-control (ROLE_M2M + ROLE_<service-name>).
#   These roles are provisioned by the Key Manager registration flow when it
#   detects the client-credentials Secret — NOT by manual admin-API assignment
#   (Netcracker's Keycloak level-SPI rejects that with "role levels mixed").
#
# SECRET PREREQUISITE (KUBERNETES_M2M_ENABLED=false — INSTALL PREREQUISITE):
#   The Secret {{ .Values.SERVICE_NAME }}-client-credentials MUST exist before
#   helm install / helm upgrade.  The chart only mounts this Secret; it does NOT
#   create it.  If the Secret is missing the agent cannot obtain its token, the
#   pull loop never authenticates, and the Pod stays NotReady indefinitely.
#
#   HOW TO CREATE THE SECRET:
#     The recommended path is Cloud Core security-scripts, which creates the
#     Secret with label core.netcracker.com/secret-type=m2m.  Key Manager then
#     watches for this label and asks Identity Provider to register the OAuth2
#     client automatically (clientId from `username`, realm role ROLE_<name>
#     from `name`, clientSecret from `password`).
#     Alternatively: create the Secret manually with the label and Key Manager
#     will still pick it up and register the client.
#
#   WHY THE CHART DOES NOT CREATE THE SECRET:
#     The platform renders Helm charts through ArgoCD, which uses `helm template`
#     (no live cluster connection).  Helm's `lookup` function is a no-op in
#     `helm template`, so any password generated in the chart would be a fresh
#     randAlphaNum on every ArgoCD sync — making the app permanently OutOfSync
#     and causing Key Manager to re-register (and rotate) the client secret on
#     every sync.  Existing M2M secrets on the stand (access-control, tenant-manager,
#     etc.) carry no ArgoCD tracking annotations; the platform intentionally keeps
#     them outside Helm-managed resources for exactly this reason.
#
#   See docs/architecture.md § "M2M Identity and Token Delivery".
KUBERNETES_M2M_ENABLED: false

# Policy delivery configuration (authz-agent-ADR-0071).
#
# The agent fetches policies and PIPs from access-control's v3 config API on a
# configurable interval and publishes them into OPA without a Pod restart.  The
# Bearer token comes from AUTHZ_PAP_CLIENT_TOKEN_FILE (written by the kubelet in
# KUBERNETES_M2M_ENABLED=true mode, or by the agent itself in
# KUBERNETES_M2M_ENABLED=false mode).
#
# PAP is the Policy Administration Point, the service the policies come from;
# the AUTHZ_PAP_CLIENT_* settings configure the agent as its client.
#
# AUTHZ_PAP_CLIENT_SOURCE_URL: base URL of the policy source: the platform's
#   access-control, or the authz-policy-admin stub installed from
#   helm-templates/authz-policy-admin (http://authz-policy-admin:18090 with that
#   chart's defaults; authz-agent-ADR-0073). Empty (default) leaves the pull
#   loop off.
AUTHZ_PAP_CLIENT_SOURCE_URL: ''
# AUTHZ_PAP_CLIENT_PULL_INTERVAL: seconds between polls.  0 disables the pull.
#   Same semantic as AUTHZ_TRUSTED_PROVIDERS_RELOAD_INTERVAL.
AUTHZ_PAP_CLIENT_PULL_INTERVAL: 30
# AUTHZ_PAP_CLIENT_TOKEN_FILE: path to the Bearer token written by the kubelet
#   (KUBERNETES_M2M_ENABLED=true) or the agent's own token loop (false). The
#   default is where the platform's charts mount the netcracker-audience token.
AUTHZ_PAP_CLIENT_TOKEN_FILE: /var/run/secrets/tokens/netcracker/token

# Entitlements resolver.
#
# The ENTITLEMENT PIP is container-pinned: it cannot arrive through the pull
# loop, the agent materialises it at startup from these
# values. The Rego resolver then calls
# `<AUTHZ_ENTITLEMENTS_URL>/api/v3/user-entitlements/user/<subject id>` once per
# decision request.
#
# Empty (default) leaves the resolver off. Policies that read
# `entitledResources` then evaluate against an empty set, which is also what the
# legacy service did with the aggregator unavailable: CONTAINS is false,
# IS EMPTY is true. Nothing is logged for that, so set the URL wherever
# entitlements-based policies are in use.
AUTHZ_ENTITLEMENTS_URL: ''
# Per-request timeout and retry count for the aggregator call. Same shape as
# the AUTHZ_JWKS_HTTP_* knobs above.
AUTHZ_ENTITLEMENTS_HTTP_TIMEOUT: 5
AUTHZ_ENTITLEMENTS_HTTP_RETRIES: 3

# The decisions are written to ephemeral container storage and are lost on a
# Pod restart. See the handover Next Steps "decision-log collector sink
# productionisation" before any production deploy.
AUTHZ_DECISION_LOG_PATH: /var/log/authz-agent/decisions/

# Autoscaling is set per environment by the resource profiles: REPLICAS and the
# HPA_* keys have no default here. The HorizontalPodAutoscaler is the platform's
# template and is rendered on every install; with HPA_ENABLED unset or false,
# it carries selectPolicy Disabled in both directions and never scales. HPA_AVG_CPU_UTILIZATION_TARGET_PERCENT is a percentage of
# CPU_LIMIT, which the template converts into the percentage of CPU_REQUEST the
# autoscaler compares against: 75 with the dev sizing renders as 85.

# CPU_REQUEST, CPU_LIMIT, MEMORY_REQUEST and MEMORY_LIMIT are set per
# environment by the resource profiles and have no default here. The schema
# requires all four, so an install without a profile stops at validation. The
# deployer's PROFILE parameter selects one of `resource-profiles/` (dev, dev-ha,
# prod, prod-nonha); by hand, pass the file with `-f`.

# The decision log is the only thing the container writes, to an emptyDir that
# nothing rotates, so the storage limit and the volume's own sizeLimit are what
# keep a long-running Pod from filling the node's disk. The volume is capped
# below the container's limit, so the kubelet evicts on the volume rather than
# on the sum of the writable layers.
AUTHZ_AGENT_EPHEMERAL_STORAGE_REQUEST: 64Mi
AUTHZ_AGENT_EPHEMERAL_STORAGE_LIMIT: 512Mi
AUTHZ_DECISION_LOG_SIZE_LIMIT: 256Mi
