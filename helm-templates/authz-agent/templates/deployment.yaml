{{- include "authz-agent.validateValues" . }}
# The agent as one container: the policy engine, the HTTP surface the clients
# call, and the loops that feed the engine with the trusted providers' keys,
# the policies and PIPs, and the agent's own token, all in one process
# (authz-agent-ADR-0080). Nothing is written to a shared volume, since the
# documents live in the process and are rebuilt at every start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: '{{ .Values.SERVICE_NAME }}'
  labels:
    name: '{{ .Values.SERVICE_NAME }}'
    app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
    app.kubernetes.io/instance: '{{ cat .Values.SERVICE_NAME "-" .Values.NAMESPACE | nospace | trunc 63 | trimSuffix "-" }}'
    app.kubernetes.io/version: '{{ .Values.ARTIFACT_DESCRIPTOR_VERSION }}'
    app.kubernetes.io/component: 'backend'
    app.kubernetes.io/part-of: '{{ .Values.APPLICATION_NAME }}'
    app.kubernetes.io/managed-by: '{{ .Values.MANAGED_BY }}'
    app.kubernetes.io/technology: 'go'
    {{- if .Values.DEPLOYMENT_SESSION_ID }}
    deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID }}'
    {{- end }}
spec:
  replicas: {{ .Values.REPLICAS | default 1 }}
  strategy:
      {{- if eq (default "" .Values.DEPLOYMENT_STRATEGY_TYPE) "recreate" }}
    type: Recreate
      {{- else if eq (default "" .Values.DEPLOYMENT_STRATEGY_TYPE) "best_effort_controlled_rollout" }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 80%
      {{- else if eq (default "" .Values.DEPLOYMENT_STRATEGY_TYPE) "ramped_slow_rollout" }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
      {{- else if eq (default "" .Values.DEPLOYMENT_STRATEGY_TYPE) "custom_rollout" }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.DEPLOYMENT_STRATEGY_MAXSURGE | default "25%" }}
      maxUnavailable: {{ .Values.DEPLOYMENT_STRATEGY_MAXUNAVAILABLE | default "25%" }}
      {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
      {{- end }}
  selector:
    matchLabels:
      name: '{{ .Values.SERVICE_NAME }}'
  template:
    metadata:
      labels:
        name: '{{ .Values.SERVICE_NAME }}'
        app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
        app.kubernetes.io/instance: '{{ cat .Values.SERVICE_NAME "-" .Values.NAMESPACE | nospace | trunc 63 | trimSuffix "-" }}'
        app.kubernetes.io/version: '{{ .Values.ARTIFACT_DESCRIPTOR_VERSION }}'
        app.kubernetes.io/component: 'backend'
        app.kubernetes.io/part-of: '{{ .Values.APPLICATION_NAME }}'
        app.kubernetes.io/technology: 'go'
    spec:
      serviceAccountName: '{{ .Values.SERVICE_NAME }}'
      # Long enough for the whole shutdown: the two HTTP surfaces are given
      # five seconds each to finish the requests in their handlers, and the
      # decision-log loop then drains what those requests queued. This Pod
      # always writes the decisions to the volume below, never uploads them,
      # so what bounds that drain is the writes rather than a timeout; the
      # default of thirty leaves twenty seconds for a batch that can hold a
      # thousand decisions, on a volume that may be backed by anything. If
      # AUTHZ_DECISION_LOG_URL is ever wired into this chart, the bound
      # becomes two ten-second upload timeouts and this number has to be
      # read again.
      terminationGracePeriodSeconds: 45
      # The service calls no Kubernetes API. The projected token below, where
      # the platform provisions the M2M identity that way, is a volume of its
      # own and is unaffected.
      automountServiceAccountToken: false
      # No runAsUser: on OpenShift the restricted SCC assigns the Pod a uid from
      # the namespace range and rejects a pinned one; on Kubernetes the
      # container keeps the uid of its image, 10001. Nothing here depends on
      # which one it gets. The trusted-provider ConfigMap and every Secret are
      # mounted world-readable, and an emptyDir is world-writable, so neither
      # fsGroup nor a per-container runAsGroup is needed: the five-container
      # Pod set the group only so that OPA could read what pap-client had
      # written into the volume the two of them shared.
      securityContext:
        runAsNonRoot: true
      topologySpreadConstraints:
      {{- if .Values.CLOUD_TOPOLOGIES }}
      {{- range $v := .Values.CLOUD_TOPOLOGIES }}
        - topologyKey: {{ $v.topologyKey }}
          maxSkew: {{ $v.maxSkew | default 1 }}
          whenUnsatisfiable: {{ $v.whenUnsatisfiable | default "ScheduleAnyway" }}
          labelSelector:
            matchLabels:
              name: "{{ $.Values.SERVICE_NAME }}"
      {{- end }}
      {{- else }}
        - maxSkew: 1
          topologyKey: {{ .Values.CLOUD_TOPOLOGY_KEY }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              name: "{{ .Values.SERVICE_NAME }}"
      {{- end }}
      volumes:
        # Mounted as a directory, deliberately not with subPath: the kubelet
        # propagates a ConfigMap edit into a directory mount by swapping the
        # `..data` symlink and never into a subPath'd file, and the service
        # re-reads this file to reload the providers without a restart
        # (authz-agent-ADR-0070).
        - name: trusted-providers
          configMap:
            name: '{{ .Values.SERVICE_NAME }}-trusted-providers'
        # sizeLimit, so a log nothing rotates cannot fill the node's disk: the
        # kubelet evicts this Pod instead. The agent's store reports how many
        # events it wrote when a write fails, so the decisions already on disk
        # are not recorded a second time by the retry.
        - name: decision-logs
          emptyDir:
            sizeLimit: '{{ .Values.AUTHZ_DECISION_LOG_SIZE_LIMIT }}'
        {{- if .Values.KUBERNETES_M2M_ENABLED }}
        # The platform's layout for projected tokens, which its charts mount
        # at /var/run/secrets/tokens with one directory per audience and its
        # Go library reads from there; netcracker is the audience for M2M
        # calls between the services of a namespace.
        - name: projected-tokens
          projected:
            sources:
              - serviceAccountToken:
                  path: netcracker/token
                  audience: netcracker
                  expirationSeconds: 600
            defaultMode: 292
        {{- else }}
        - name: client-credentials
          secret:
            secretName: '{{ .Values.SERVICE_NAME }}-client-credentials'
            defaultMode: 292
        {{- end }}
      containers:
        - name: '{{ .Values.SERVICE_NAME }}'
          image: '{{ .Values.IMAGE_REPOSITORY }}:{{ .Values.TAG }}'
          imagePullPolicy: '{{ .Values.IMAGE_PULL_POLICY }}'
          ports:
            - name: web
              containerPort: 8080
              protocol: TCP
            - name: internal
              containerPort: 8181
              protocol: TCP
          env:
            - name: LOGGING_LEVEL_ROOT
              value: '{{ .Values.LOG_LEVEL }}'
            - name: AUTHZ_PUBLIC_ADDR
              value: "0.0.0.0:8080"
            - name: AUTHZ_HTTP_ADDR
              value: "0.0.0.0:8181"
            - name: AUTHZ_TRUSTED_PROVIDERS_FILE
              value: '{{ .Values.AUTHZ_TRUSTED_PROVIDERS_FILE }}'
            - name: AUTHZ_JWKS_BOOTSTRAP_REQUIRED
              value: '{{ include "authz-agent.jwksBootstrapRequired" . }}'
            - name: AUTHZ_JWKS_HTTP_TIMEOUT
              value: '{{ .Values.AUTHZ_JWKS_HTTP_TIMEOUT }}'
            - name: AUTHZ_JWKS_HTTP_RETRIES
              value: '{{ .Values.AUTHZ_JWKS_HTTP_RETRIES }}'
            - name: AUTHZ_TRUSTED_PROVIDERS_RELOAD_INTERVAL
              value: '{{ .Values.AUTHZ_TRUSTED_PROVIDERS_RELOAD_INTERVAL }}'
            - name: AUTHZ_TENANT_MANAGER_URL
              value: '{{ .Values.AUTHZ_TENANT_MANAGER_URL }}'
            - name: AUTHZ_PAP_CLIENT_SOURCE_URL
              value: '{{ include "authz-agent.papSourceURL" . }}'
            - name: AUTHZ_PAP_CLIENT_PULL_INTERVAL
              value: '{{ .Values.AUTHZ_PAP_CLIENT_PULL_INTERVAL }}'
            - name: AUTHZ_PAP_CLIENT_TOKEN_FILE
              value: '{{ .Values.AUTHZ_PAP_CLIENT_TOKEN_FILE }}'
            {{- if not .Values.KUBERNETES_M2M_ENABLED }}
            # Client credentials: the service obtains its M2M token itself
            # and refreshes it before it expires.
            - name: AUTHZ_M2M_TOKEN_URL
              value: '{{ .Values.IDENTITY_PROVIDER_URL }}/auth/realms/cloud-common/protocol/openid-connect/token'
            - name: AUTHZ_M2M_CLIENT_ID_FILE
              value: /etc/secret/username
            - name: AUTHZ_M2M_CLIENT_SECRET_FILE
              value: /etc/secret/password
            - name: AUTHZ_M2M_RENEW_BEFORE_SECONDS
              value: "60"
            {{- end }}
            - name: AUTHZ_ENTITLEMENTS_URL
              value: '{{ .Values.AUTHZ_ENTITLEMENTS_URL }}'
            - name: AUTHZ_DECISION_LOG_FILE
              value: '{{ printf "%s/decision-logs.jsonl" (trimSuffix "/" .Values.AUTHZ_DECISION_LOG_PATH) }}'
            - name: AUTHZ_DECISION_LOG_HEADERS
              value: x-request-id,x-authz-original-path
          volumeMounts:
            - name: trusted-providers
              mountPath: /etc/authz
              readOnly: true
            - name: decision-logs
              mountPath: '{{ .Values.AUTHZ_DECISION_LOG_PATH }}'
            {{- if .Values.KUBERNETES_M2M_ENABLED }}
            - name: projected-tokens
              mountPath: /var/run/secrets/tokens
              readOnly: true
            {{- else }}
            - name: client-credentials
              mountPath: /etc/secret
              readOnly: true
            {{- end }}
          # /health answers once the trusted providers meet the bootstrap
          # rules, and /ready once the policies have loaded as well, so a Pod
          # waiting for its policy source is held out of the Service instead
          # of being restarted.
          readinessProbe:
            httpGet:
              path: /ready
              port: internal
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: internal
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: '{{ .Values.CPU_REQUEST }}'
              memory: '{{ .Values.MEMORY_REQUEST }}'
              ephemeral-storage: '{{ .Values.AUTHZ_AGENT_EPHEMERAL_STORAGE_REQUEST }}'
            limits:
              cpu: '{{ .Values.CPU_LIMIT }}'
              memory: '{{ .Values.MEMORY_LIMIT }}'
              ephemeral-storage: '{{ .Values.AUTHZ_AGENT_EPHEMERAL_STORAGE_LIMIT }}'
          securityContext:
            allowPrivilegeEscalation: false
            # Read-only on Kubernetes only, as on the platform's charts: the
            # decision log is the one thing the container writes, and it goes
            # to the decision-logs emptyDir.
            readOnlyRootFilesystem: {{ and .Values.READONLY_CONTAINER_FILE_SYSTEM_ENABLED (eq .Values.PAAS_PLATFORM "KUBERNETES") }}
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
