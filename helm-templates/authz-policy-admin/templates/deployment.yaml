# The access-control stub (authz-agent-ADR-0073).
#
# Serves the access-control v3 config API from policies uploaded over its own
# control surface, so a team with no access-control installation can still feed
# authz-agent through the production pull path: the agent's
# AUTHZ_PAP_CLIENT_SOURCE_URL points at this chart's Service.
#
# NOT a production component: the control surface has no authentication at all,
# so anything able to reach this Service, or the internal gateway the chart
# registers it on, can replace the authorization policy set of every agent
# pulling from it.
#
# This chart takes none of the platform's scaling blocks, no autoscaler, no
# strategy switch and no spread constraints: the stub runs exactly one Pod on a
# ReadWriteOnce volume, so each of them would be inert or would break the
# attach.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: '{{ .Values.SERVICE_NAME }}'
  labels:
    name: '{{ .Values.SERVICE_NAME }}'
    app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
    app.kubernetes.io/instance: '{{ cat .Values.SERVICE_NAME "-" .Values.NAMESPACE | nospace | trunc 63 | trimSuffix "-" }}'
    app.kubernetes.io/version: '{{ .Values.ARTIFACT_DESCRIPTOR_VERSION }}'
    app.kubernetes.io/component: 'test-double'
    app.kubernetes.io/part-of: '{{ .Values.APPLICATION_NAME }}'
    app.kubernetes.io/managed-by: '{{ .Values.MANAGED_BY }}'
    app.kubernetes.io/technology: 'go'
    {{- if .Values.DEPLOYMENT_SESSION_ID }}
    deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID }}'
    {{- end }}
spec:
  # Exactly one Pod, by design. The uploaded policies live on the Pod's volume
  # with no replication, so a second Pod would serve different content and a
  # different hash, and the agent's pull loop would flap between them. Scaling
  # this Deployment up is never correct.
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: a surge Pod cannot attach the same
    # ReadWriteOnce volume, so a rolling update would deadlock on the attach.
    type: Recreate
  selector:
    matchLabels:
      name: '{{ .Values.SERVICE_NAME }}'
  template:
    metadata:
      labels:
        name: '{{ .Values.SERVICE_NAME }}'
        app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
        app.kubernetes.io/instance: '{{ cat .Values.SERVICE_NAME "-" .Values.NAMESPACE | nospace | trunc 63 | trimSuffix "-" }}'
        app.kubernetes.io/version: '{{ .Values.ARTIFACT_DESCRIPTOR_VERSION }}'
        app.kubernetes.io/component: 'test-double'
        app.kubernetes.io/part-of: '{{ .Values.APPLICATION_NAME }}'
        app.kubernetes.io/technology: 'go'
    spec:
      # No serviceAccountName and no token mounted: the stub calls no
      # Kubernetes API.
      automountServiceAccountToken: false
      # No runAsUser: on OpenShift the restricted SCC assigns the Pod a uid from
      # the namespace range and rejects a pinned one. The stub writes to its
      # PersistentVolume: on Kubernetes fsGroup makes the volume writable for the
      # image user (10001), whose container also gets runAsGroup 10001; on
      # OpenShift the restricted SCC assigns the uid and the fsGroup from the
      # namespace range. Some CSI and NFS provisioners ignore fsGroup; the
      # container then fails its startup write probe and reports the directory
      # and uid in its logs.
      securityContext:
        runAsNonRoot: true
        {{- if eq .Values.PAAS_PLATFORM "KUBERNETES" }}
        fsGroup: 10001
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: '{{ .Values.SERVICE_NAME }}-data'
      containers:
        - name: '{{ .Values.SERVICE_NAME }}'
          image: '{{ .Values.IMAGE_REPOSITORY }}:{{ .Values.TAG }}'
          imagePullPolicy: '{{ .Values.IMAGE_PULL_POLICY }}'
          ports:
            - name: web
              containerPort: {{ .Values.AUTHZ_POLICY_ADMIN_PORT }}
              protocol: TCP
          env:
            - name: LOGGING_LEVEL_ROOT
              value: '{{ .Values.LOG_LEVEL }}'
            - name: AUTHZ_POLICY_ADMIN_PORT
              value: '{{ .Values.AUTHZ_POLICY_ADMIN_PORT }}'
            # Uploaded policies and PIPs are written here as policies.json /
            # pips.json and reloaded at startup.
            - name: AUTHZ_POLICY_ADMIN_DATA_DIR
              value: '{{ .Values.AUTHZ_POLICY_ADMIN_DATA_DIR }}'
            - name: AUTHZ_POLICY_ADMIN_DEFAULT_TENANT_ID
              value: '{{ .Values.AUTHZ_POLICY_ADMIN_DEFAULT_TENANT_ID }}'
          volumeMounts:
            - name: data
              mountPath: '{{ .Values.AUTHZ_POLICY_ADMIN_DATA_DIR }}'
          # An unwritable volume makes the process exit at startup. The startup
          # probe turns that into a fast, obvious CrashLoopBackOff instead of a
          # liveness-driven restart storm.
          startupProbe:
            httpGet:
              path: /authz-policy-admin/hash
              port: {{ .Values.AUTHZ_POLICY_ADMIN_PORT }}
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /authz-policy-admin/hash
              port: {{ .Values.AUTHZ_POLICY_ADMIN_PORT }}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /authz-policy-admin/hash
              port: {{ .Values.AUTHZ_POLICY_ADMIN_PORT }}
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: '{{ .Values.CPU_REQUEST }}'
              memory: '{{ .Values.MEMORY_REQUEST }}'
              ephemeral-storage: '{{ .Values.AUTHZ_POLICY_ADMIN_EPHEMERAL_STORAGE_REQUEST }}'
            limits:
              cpu: '{{ .Values.CPU_LIMIT }}'
              memory: '{{ .Values.MEMORY_LIMIT }}'
              ephemeral-storage: '{{ .Values.AUTHZ_POLICY_ADMIN_EPHEMERAL_STORAGE_LIMIT }}'
          securityContext:
            allowPrivilegeEscalation: false
            {{- if eq .Values.PAAS_PLATFORM "KUBERNETES" }}
            runAsGroup: 10001
            {{- end }}
            # Read-only on Kubernetes only, as on the platform's charts. Safe at
            # any value: every write of the stub lands on the mounted volume,
            # and the base image's entrypoint rebuilds the CA store only when
            # it finds certificate files under /tmp/cert or the service-account
            # mount, neither of which this Pod has.
            readOnlyRootFilesystem: {{ and .Values.READONLY_CONTAINER_FILE_SYSTEM_ENABLED (eq .Values.PAAS_PLATFORM "KUBERNETES") }}
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
